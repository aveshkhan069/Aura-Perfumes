<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e8d5b0"/>
      <stop offset="45%"  stop-color="#c5a880"/>
      <stop offset="100%" stop-color="#9a7d56"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f0e0c0"/>
      <stop offset="60%"  stop-color="#c5a880"/>
      <stop offset="100%" stop-color="#8a6d42"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="320" fill="#0d0d0d"/>

  <!-- Flame / Bottle icon -->
  <!-- Outer flame silhouette -->
  <path d="M160 48 C160 48 134 90 134 122 C134 148 145 162 160 168 C175 162 186 148 186 122 C186 90 160 48 160 48Z" fill="url(#flameGrad)" opacity="0.9"/>
  <!-- Inner highlight -->
  <path d="M160 72 C160 72 148 100 148 120 C148 134 153 142 160 145 C167 142 172 134 172 120 C172 100 160 72 160 72Z" fill="#0d0d0d" opacity="0.35"/>

  <!-- Thin separator line -->
  <line x1="96" y1="182" x2="224" y2="182" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.7"/>

  <!-- AURA lettering -->
  <text
    x="160"
    y="218"
    font-family="'Didact Gothic', 'Cormorant Garamond', 'Garamond', 'Times New Roman', serif"
    font-size="52"
    font-weight="700"
    letter-spacing="18"
    text-anchor="middle"
    fill="url(#goldGrad)"
  >AURA</text>

  <!-- Tagline -->
  <text
    x="160"
    y="242"
    font-family="'Helvetica Neue', 'Arial', sans-serif"
    font-size="9.5"
    font-weight="300"
    letter-spacing="6.5"
    text-anchor="middle"
    fill="#c5a880"
    opacity="0.75"
  >PARFUMS DE LUXE</text>
</svg>
